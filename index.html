<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>I&amp;C Toolbox</title>
  <meta name="description" content="Navaja suiza offline para instrumentistas: conversiones de unidades, señales 4-20 mA, placa orificio ISO 5167 y más.">
  <meta name="theme-color" content="#0f4c5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Aplica el tema elegido antes de pintar, para que no parpadee.
    try { const t = localStorage.getItem('ict.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" id="back" class="back" aria-label="Volver al inicio" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a href="#/" id="brand" class="brand" aria-label="Inicio">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <span>I&amp;C Toolbox</span>
    </a>
    <h1 id="title" class="title" hidden></h1>
    <span id="net" class="net" hidden>Sin conexión</span>
  </header>

  <main id="app">
    <section data-view="home">
      <h1 class="sr-only">Herramientas</h1>
      <label class="search">
        <span class="sr-only">Buscar herramienta</span>
        <input id="search" type="search" placeholder="Buscar: caudal, 4-20, psi…" autocomplete="off" enterkeyhint="search">
      </label>
      <div id="recent" class="recent" hidden></div>
      <div id="catalog"></div>
      <p id="no-results" class="note" hidden></p>
    </section>
    <!-- Cada herramienta se monta aquí en su propia <section data-view> al abrirla. -->
  </main>

  <div id="update" class="update" role="status" hidden>
    <span>Hay una versión nueva.</span>
    <button type="button" id="update-btn">Actualizar</button>
  </div>

  <footer class="foot">
    <span>v<span id="version"></span></span>
    <label class="theme">Tema
      <select id="theme">
        <option value="auto">Automático</option>
        <option value="light">Claro</option>
        <option value="dark">Oscuro</option>
      </select>
    </label>
    <a href="https://github.com/Lestradez/IC-Toolbox" rel="noopener">Código fuente</a>
  </footer>
  <footer class="foot foot2">
    <button type="button" id="report" class="linkbtn">Reportar un problema</button>
    <label class="stats" id="stats-row" hidden>
      <input type="checkbox" id="stats" checked> Uso anónimo
    </label>
  </footer>

  <dialog id="report-dialog" class="report-dialog" aria-labelledby="report-title">
    <h2 id="report-title">Reportar un problema</h2>
    <p class="note">Se enviará con la herramienta y la versión ya indicadas.</p>
    <a id="report-github" class="report-opt" href="#" target="_blank" rel="noopener">
      <strong>Con GitHub</strong><span>Requiere cuenta de GitHub. El reporte es público.</span>
    </a>
    <a id="report-form" class="report-opt" href="#" target="_blank" rel="noopener" hidden>
      <strong>Con formulario</strong><span>Sin cuenta. Solo lo ve el autor de la app.</span>
    </a>
    <button type="button" id="report-close" class="report-close">Cancelar</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
